[workspace]
resolver = "2"
members = ["crates/mpc-core", "crates/multipc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
snow = "0.10"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.3"
toml = "1"
dirs = "7"
gethostname = "1"
miniz_oxide = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
arboard = { version = "3", default-features = false, features = ["image-data"] }

[profile.release]
lto = "thin"
codegen-units = 1
